kind = "web"
previewPath = "/pdf/"
title = "Al Burhan Secure PDF Enterprise"
version = "1.0.0"
id = "artifacts/pdf-enterprise"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pdf/" ]
localPort = 18141

[services.development]
run = "pnpm --filter @workspace/pdf-enterprise run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pdf-enterprise", "run", "build" ]
publicDir = "artifacts/pdf-enterprise/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18141"
BASE_PATH = "/pdf/"
