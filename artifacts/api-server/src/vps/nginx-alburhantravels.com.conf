# ══════════════════════════════════════════════════════════════════════════════
#  Nginx config — alburhantravels.com
#  Deploy to: /etc/nginx/sites-available/alburhantravels.com
#  Enable:    ln -s /etc/nginx/sites-available/alburhantravels.com \
#                    /etc/nginx/sites-enabled/alburhantravels.com
# ══════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name alburhantravels.com www.alburhantravels.com;

    # Allow Let's Encrypt ACME challenge through HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://alburhantravels.com$request_uri;
    }
}

# ── www → non-www redirect (HTTPS) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.alburhantravels.com;

    ssl_certificate     /etc/letsencrypt/live/alburhantravels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alburhantravels.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://alburhantravels.com$request_uri;
}

# ── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alburhantravels.com;

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/alburhantravels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alburhantravels.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header Referrer-Policy           strict-origin-when-cross-origin       always;
    add_header X-XSS-Protection          "1; mode=block"                       always;

    # ── Upload limits ────────────────────────────────────────────────────────
    client_max_body_size 150m;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    application/pdf;

    # ── Shared proxy settings ─────────────────────────────────────────────────
    proxy_http_version      1.1;
    proxy_set_header        Upgrade           $http_upgrade;
    proxy_set_header        Connection        "upgrade";
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_cache_bypass      $http_upgrade;
    proxy_read_timeout      300s;
    proxy_connect_timeout   75s;
    proxy_send_timeout      300s;

    # ══════════════════════════════════════════════════════════════════════════
    #  Al Burhan PDF Enterprise  →  port 3001
    # ══════════════════════════════════════════════════════════════════════════
    location /pdf/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
    }

    location /pdf/api/ {
        proxy_pass          http://127.0.0.1:3001;
        proxy_buffering     off;
        proxy_read_timeout  300s;
    }

    # ══════════════════════════════════════════════════════════════════════════
    #  API Routes  →  port 3000  (Al Burhan main backend)
    # ══════════════════════════════════════════════════════════════════════════

    # Webhook endpoints — no buffering, increased timeout
    location /api/webhook/ {
        proxy_pass          http://127.0.0.1:3000;
        proxy_buffering     off;
        proxy_read_timeout  60s;
    }

    location /api/social-media/webhook/ {
        proxy_pass          http://127.0.0.1:3000;
        proxy_buffering     off;
        proxy_read_timeout  60s;
    }

    # File download / upload endpoints — high timeout
    location /api/files/ {
        proxy_pass          http://127.0.0.1:3000;
        proxy_buffering     off;
        proxy_read_timeout  300s;
    }

    location /api/migrate/ {
        proxy_pass          http://127.0.0.1:3000;
        proxy_buffering     off;
        proxy_read_timeout  600s;
    }

    # All other API routes
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # ══════════════════════════════════════════════════════════════════════════
    #  Frontend static assets (React SPA)
    #  The Node server already serves the static build; proxy everything else.
    # ══════════════════════════════════════════════════════════════════════════
    location / {
        proxy_pass http://127.0.0.1:3000;

        # SPA fallback (handled by Node, but belt-and-suspenders)
        proxy_intercept_errors off;
    }

    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        proxy_pass         http://127.0.0.1:3000;
        expires            7d;
        add_header         Cache-Control "public, no-transform";
        add_header         Vary Accept-Encoding;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/alburhantravels.com.access.log;
    error_log  /var/log/nginx/alburhantravels.com.error.log warn;
}
